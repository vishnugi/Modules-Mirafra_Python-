<!DOCTYPE html>
<html>
<head>
    <title>Apply Leave</title>
</head>
<body>

    <h1>Apply Leave</h1>

    <form method="POST" >
        {% csrf_token %}

        <label>Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label> Date:</label><br>
        <input type="date" name="date" required><br><br>

        <button type="submit">Submit</button>
    </form>

    <br>
    <a href="{% url 'home' %}">
        <button>Back to Home</button>
    </a>

</body>
</html>
